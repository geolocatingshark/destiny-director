<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV2 builder — web prototype</title>
<!--
  ===========================================================================
  Components V2 builder — WEB prototype (design artifact, not production)
  ===========================================================================

  Standalone: open the file, no build step, no server — matching web_static's
  "served statically, no build step" contract.

  WHAT THIS ARGUES
  ----------------
  dd/anchor/cv2_builder.py's interaction model is not a *design*; it is a pile
  of workarounds for Discord's component budget:

    Discord constraint            ->  the workaround it forced
    can't click a rendered post   ->  a <select> listing "Text: Weekly res…"
    no drag                       ->  "Move up" / "Move down" buttons
    5 components per row          ->  "Open ▸" / "◂ Back" scope drilling, so
                                      you only ever see ONE level at a time
    no inline editing             ->  a modal round-trip per field edit
    no free-form layout           ->  add-always-lands-after-the-selection

  A web page has none of those constraints, so a faithful port would import
  five workarounds for problems that no longer exist. This prototype deletes
  all five:

    1. THE PREVIEW IS THE EDITOR. Click a block in the rendered post to select
       it. No picker <select> — the labels it needed ("Section (2 text, …)")
       exist only because you couldn't see the thing.
    2. TEXT EDITS IN PLACE. Click a text block, type. Raw markdown while
       focused, rendered on blur. No modal.
    3. DRAG TO REORDER *AND* RE-PARENT. Kills Move up/down AND Open/Back at
       once: the whole tree is on screen, so dragging into a container is the
       same gesture as reordering. Depth is <= 3 — it always fits.
    4. RIGHT-CLICK ANYWHERE. On a block: Edit / Duplicate / Wrap in container
       / Add above / Add below / Delete. On empty canvas: Add block.
    5. INSERT WHERE YOU POINT. Hover a gap, a "+" rail appears; click it for a
       type palette filtered to what is legal *there*.

  Plus three things the Discord builder simply cannot have:
    - Undo/redo (Cmd/Ctrl+Z). The single biggest safety win.
    - Validation anchored to the offending block, not a wall of prose at the
      bottom of the message.
    - Rules taught by the UI: a section's accessory is a visible empty slot,
      and an illegal drag says WHY ("containers are top-level only") instead
      of silently omitting the option from a dropdown.

  FIDELITY TO THE REPO
  --------------------
  - State is a list of raw Discord component dicts — byte-identical to
    cv2_nodes.Node. "Show JSON" emits exactly what RawComponentBuilder sends.
  - Nesting rules mirror cv2_nodes.addable_kinds(): container is top-level
    only, section holds 1-3 text displays + one accessory, thumbnail is only
    ever an accessory.
  - Validation messages are lifted verbatim from cv2_nodes.validate().
  - Preview markup reuses cv2_render.py's class names (.cv2-container,
    .cv2-text, .cv2-section, .md-h2, …) and mirror_log.css's styling for them,
    so the canvas and the mirror-log render pane stay one visual system.
  - Colours are shared.css's :root tokens, copied verbatim.

  WHAT IS FAKED (deliberately, it's a prototype)
  ----------------------------------------------
  - Markdown/emoji rendering is a JS approximation of hybrid_post_core's
    _render_line. Production keeps rendering server-side via
    render_cv2_nodes_html and injects trusted HTML, per plans/web_cv2_builder.md
    — the XSS contract does not move to the client.
  - No file/attachment (type 13) authoring, matching cv2_nodes.
  - No persistence, no /preview or /validate round-trip.

  Copyright (c) 2019-present gsfernandes81 — AGPL-3.0-or-later, as the repo.
-->
<style>
/* ---------------------------------------------------------------------------
   Tokens — copied verbatim from web_static/shared.css so this drops straight
   into the anchor web UI. Production would just <link> shared.css.
   --------------------------------------------------------------------------- */
:root {
  color-scheme: dark;
  --surface-0: #14161a;
  --surface-1: #1b1d22;
  --surface-2: #202329;
  --surface-3: #24272e;
  --border: #3a3f47;
  --border-hover: #8a5a72;
  --accent: #EC42A5;
  --accent-ink: #14161a;
  --accent-strong: #2e5bff;
  --accent-tint: #2b1420;
  --accent-text-strong: #ffffff;
  --link: #9fb4ff;
  --text-1: #e6e6e6;
  --text-2: #cfd3d6;
  --text-3: #b9bec4;
  --text-muted: #8b9096;
  --text-faint: #9aa0a6;
  --ok: #7ee787;
  --err: #ff7b72;
  --danger-surface: #3a1e1e;
  --danger-text: #ff9d97;
  --danger-border: #5a2a2a;
  --danger-bg: #2a1e1e;
  --radius: 8px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--surface-1); color: var(--text-1); line-height: 1.4;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh;
  overflow: hidden;
}

/* --- app chrome ---------------------------------------------------------- */
.appbar {
  display: flex; align-items: center; gap: .8rem;
  padding: .55rem .9rem; border-bottom: 1px solid var(--border);
  background: var(--surface-1);
}
.appbar h1 { font-size: .98rem; margin: 0; font-weight: 650; }
.appbar .muted { color: var(--text-faint); font-size: .78rem; }
.spacer { flex: 1; }

button {
  padding: .38rem .7rem; font: inherit; font-size: .82rem; cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-3); color: var(--text-1);
}
button:hover:not(:disabled) { border-color: var(--border-hover); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: var(--accent-strong); color: var(--accent-text-strong); border-color: transparent; }
button.danger { background: var(--danger-surface); color: var(--danger-text); border-color: var(--danger-border); }
button.icon { padding: .3rem .45rem; line-height: 1; }

main {
  display: grid; grid-template-columns: 13rem minmax(0, 1fr) 19rem;
  min-height: 0; overflow: hidden;
}
@media (max-width: 1100px) { main { grid-template-columns: 11rem minmax(0, 1fr); } aside.inspector { display: none; } }

/* --- left rail: block palette -------------------------------------------- */
.palette {
  border-right: 1px solid var(--border); background: var(--surface-1);
  padding: .7rem .6rem; overflow: auto; display: flex; flex-direction: column; gap: .3rem;
}
.rail-title {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-muted); margin: .2rem .2rem .35rem;
}
.pal-item {
  display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left;
  padding: .42rem .5rem; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; color: var(--text-2);
  font-size: .82rem; cursor: grab;
}
.pal-item:hover { background: var(--surface-2); border-color: var(--border); color: var(--text-1); }
.pal-item:active { cursor: grabbing; }
.pal-item .glyph {
  width: 1.35rem; height: 1.35rem; flex: none; display: grid; place-items: center;
  border-radius: 4px; background: var(--surface-3); font-size: .75rem;
}
.pal-hint {
  margin-top: auto; padding: .5rem; font-size: .7rem; color: var(--text-muted);
  border-top: 1px solid var(--border);
}
.pal-hint kbd { font: inherit; font-size: .95em; background: var(--surface-3);
  border: 1px solid var(--border); border-radius: 3px; padding: 0 .25em; }

/* --- centre: the canvas (= live preview = editor) ------------------------ */
.canvas-wrap { overflow: auto; padding: 1.1rem 1.3rem 4rem; min-width: 0; }
.canvas-head { display: flex; align-items: baseline; gap: .6rem; margin: 0 0 .7rem; }
.canvas-head h2 { font-size: .82rem; margin: 0; color: var(--text-2);
  text-transform: uppercase; letter-spacing: .04em; }
.canvas-head .muted { font-size: .74rem; color: var(--text-muted); }

/* The message surface. Mirrors Discord's own message column width. */
#canvas {
  background: var(--surface-0); border: 1px solid var(--border);
  border-radius: var(--radius); padding: .5rem .7rem .7rem;
  max-width: 46rem; font-size: .88rem; min-height: 6rem;
}

/* --- the rendered node tree (cv2_render.py class names) ------------------ */
.cv2-container {
  border-left: 3px solid var(--accent);
  background: var(--surface-2); border-radius: var(--radius-sm);
  padding: .5rem .6rem;
}
.cv2-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.md-h1 { font-size: 1.2rem; font-weight: 700; }
.md-h2 { font-size: 1.05rem; font-weight: 700; }
.md-h3 { font-size: .95rem; font-weight: 700; }
.md-small { font-size: .74rem; color: var(--text-muted); }
.md-bullet::before { content: "• "; color: var(--text-3); }
.cv2-text a { color: var(--link); }
.cv2-text code { background: var(--surface-3); border-radius: 3px; padding: 0 .25em; font-size: .92em; }
.cv2-section { display: flex; gap: .6rem; align-items: flex-start; justify-content: space-between; }
.cv2-section-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cv2-thumb { max-width: 84px; max-height: 84px; border-radius: var(--radius-sm); object-fit: cover; display: block; }
.cv2-media { display: grid; gap: 3px; border-radius: var(--radius-sm); overflow: hidden; margin: .15rem 0; }
.cv2-media-item { display: block; overflow: hidden; min-width: 0; background: var(--surface-3); }
.cv2-media-item img { display: block; width: 100%; height: 100%; object-fit: cover; }
.cv2-media.n1 { grid-template-columns: 1fr; }
.cv2-media.n1 .cv2-media-item img { width: auto; max-width: 100%; max-height: 300px; object-fit: contain; }
.cv2-media.n2 { grid-template-columns: 1fr 1fr; }
.cv2-media.n2 .cv2-media-item { aspect-ratio: 1; }
.cv2-media.n3 { grid-template-columns: 2fr 1fr; }
.cv2-media.n3 .cv2-media-item:first-child { grid-row: span 2; aspect-ratio: 1; }
.cv2-media.n3 .cv2-media-item:not(:first-child) { aspect-ratio: 2 / 1; }
.cv2-media.n4 { grid-template-columns: 1fr 1fr; }
.cv2-media.n4 .cv2-media-item { aspect-ratio: 1; }
.cv2-media.many { grid-template-columns: 1fr 1fr 1fr; }
.cv2-media.many .cv2-media-item { aspect-ratio: 1; }
.cv2-sep { border: none; border-top: 1px solid var(--border); margin: .15rem 0; }
.cv2-spacer { height: .5rem; }
.cv2-buttons { display: flex; flex-wrap: wrap; gap: .4rem; }
.cv2-button {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .25rem .6rem; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface-3);
  color: var(--link); font-size: .8rem; text-decoration: none;
}
.cv2-placeholder { font-size: .76rem; color: var(--text-muted); font-style: italic; }

/* --- block affordances (the web-only layer) ------------------------------ */
/* Every node is a .blk: hoverable, clickable, draggable, right-clickable. */
.blk { position: relative; border-radius: var(--radius-sm); }
.blk > .blk-body { border-radius: var(--radius-sm); outline: 1px solid transparent; outline-offset: 2px; }
.blk:hover > .blk-body { outline-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.blk.sel > .blk-body { outline: 2px solid var(--accent); outline-offset: 2px; }
.blk.dragging { opacity: .35; }
.blk.invalid > .blk-body { outline-color: var(--err); }

/* Drag handle + type chip, revealed on hover/selection in the left gutter. */
.blk-grip {
  position: absolute; left: -1.35rem; top: .1rem; width: 1.1rem; height: 1.3rem;
  display: none; place-items: center; cursor: grab;
  color: var(--text-muted); border-radius: 3px; font-size: .8rem; user-select: none;
}
.blk:hover > .blk-grip, .blk.sel > .blk-grip { display: grid; }
.blk-grip:hover { background: var(--surface-3); color: var(--text-1); }
.blk-tag {
  position: absolute; right: .25rem; top: -.62rem; z-index: 3;
  display: none; padding: 0 .35rem; border-radius: 3px;
  font-size: .62rem; letter-spacing: .04em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink); font-weight: 700;
}
.blk.sel > .blk-tag { display: block; }
/* Insertion rail: the "+" that appears in the gap you point at. Kept at ~10px
   so it is a real pointer target, not a hairline you have to hunt for. */
.rail {
  position: relative; height: .62rem; margin: 0 -.15rem;
  display: flex; align-items: center; cursor: copy;
}
.rail::before {
  content: ""; flex: 1; height: 2px; border-radius: 2px;
  background: transparent; transition: background .08s;
}
.rail:hover::before, .rail.armed::before { background: var(--accent); }
.rail::after {
  content: "+"; position: absolute; left: 50%; transform: translateX(-50%);
  width: 1.05rem; height: 1.05rem; display: none; place-items: center;
  border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  font-size: .8rem; font-weight: 700; line-height: 1;
}
.rail:hover::after, .rail.armed::after { display: grid; }
.rail.blocked { cursor: not-allowed; }
.rail.blocked:hover::before, .rail.blocked.armed::before { background: var(--err); }
.rail.blocked:hover::after, .rail.blocked.armed::after { display: none; }
/* Rails stay out of the way until the pointer is actually near them. */
.scope { display: flex; flex-direction: column; }

/* A section's accessory slot is a REAL slot — the rule is visible, not hidden
   behind a dropdown that silently omits the option. */
.acc-slot {
  flex: none; width: 84px; min-height: 56px; border-radius: var(--radius-sm);
  border: 1px dashed var(--border); display: grid; place-items: center;
  font-size: .62rem; color: var(--text-muted); text-align: center;
  padding: .3rem; cursor: copy;
}
.acc-slot:hover, .acc-slot.armed { border-color: var(--accent); color: var(--text-2); }
.acc-slot.filled { border: none; padding: 0; min-height: 0; width: auto; }

/* In-place text editing: raw markdown while focused. */
.blk-edit {
  width: 100%; resize: none; overflow: hidden;
  font: inherit; font-size: .86rem; line-height: 1.45;
  color: var(--text-1); background: var(--surface-3);
  border: 1px solid var(--accent); border-radius: var(--radius-sm);
  padding: .35rem .45rem; display: block;
}
.edit-hint {
  position: absolute; right: .3rem; bottom: -1.05rem; z-index: 3;
  font-size: .64rem; color: var(--text-muted);
}

.empty-canvas {
  border: 1px dashed var(--border); border-radius: var(--radius-sm);
  padding: 1.6rem 1rem; text-align: center; color: var(--text-muted); font-size: .82rem;
}
.empty-canvas b { color: var(--text-2); }

/* --- right: inspector ---------------------------------------------------- */
aside.inspector {
  border-left: 1px solid var(--border); background: var(--surface-1);
  overflow: auto; padding: .7rem .75rem 2rem;
  display: flex; flex-direction: column; gap: .8rem;
}
.insp-head { display: flex; align-items: center; gap: .4rem; }
.insp-head h3 { margin: 0; font-size: .82rem; text-transform: uppercase;
  letter-spacing: .04em; color: var(--text-2); }
.field { display: flex; flex-direction: column; gap: .25rem; }
.field > label { font-size: .74rem; color: var(--text-2); }
.field .help { font-size: .68rem; color: var(--text-muted); }
input[type="text"], input[type="url"], textarea, select {
  width: 100%; padding: .35rem .45rem; font: inherit; font-size: .8rem;
  background: var(--surface-3); color: var(--text-1);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { min-height: 4rem; resize: vertical; }
label.inline { display: flex; flex-direction: row; align-items: center; gap: .4rem; font-size: .78rem; color: var(--text-2); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
.row { display: flex; gap: .4rem; align-items: center; }
.row > input[type="color"] { width: 2.1rem; height: 1.9rem; padding: 0; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--surface-3); }
.insp-empty { color: var(--text-muted); font-size: .78rem; }
.insp-empty ul { padding-left: 1.05rem; margin: .4rem 0 0; }
.insp-empty li { margin: .18rem 0; }

.url-row { display: flex; gap: .3rem; align-items: center; }
.url-row input { flex: 1; font-size: .74rem; }

/* Validation, anchored: click a problem -> selects the block that caused it. */
.problems {
  border: 1px solid var(--danger-border); background: var(--danger-bg);
  border-radius: var(--radius-sm); padding: .45rem .55rem;
}
.problems h4 { margin: 0 0 .3rem; font-size: .72rem; color: var(--danger-text);
  text-transform: uppercase; letter-spacing: .04em; }
.problems button {
  display: block; width: 100%; text-align: left; background: transparent;
  border: none; padding: .18rem .1rem; color: var(--err); font-size: .74rem; cursor: pointer;
}
.problems button:hover { text-decoration: underline; }
.ok-note { color: var(--ok); font-size: .76rem; }

/* --- bottom bar ---------------------------------------------------------- */
.statusbar {
  display: flex; align-items: center; gap: .6rem;
  padding: .45rem .9rem; border-top: 1px solid var(--border);
  background: var(--surface-1); font-size: .76rem; color: var(--text-muted);
}

/* --- floating layers ----------------------------------------------------- */
.menu {
  position: fixed; z-index: 60; min-width: 12.5rem;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: .25rem;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.menu button {
  display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left;
  background: transparent; border: none; padding: .34rem .5rem;
  border-radius: 4px; font-size: .8rem; color: var(--text-2);
}
.menu button:hover:not(:disabled) { background: var(--accent-tint); color: var(--text-1); }
.menu button .glyph { width: 1.1rem; text-align: center; opacity: .8; }
.menu button .kbd { margin-left: auto; font-size: .68rem; color: var(--text-muted); }
.menu button.danger { color: var(--danger-text); background: transparent; border: none; }
.menu hr { border: none; border-top: 1px solid var(--border); margin: .22rem .3rem; }
.menu .menu-label {
  padding: .3rem .5rem .18rem; font-size: .64rem; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text-muted);
}

.toast {
  position: fixed; left: 50%; bottom: 3.2rem; transform: translateX(-50%);
  z-index: 80; padding: .4rem .8rem; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: .76rem; color: var(--text-2); pointer-events: none;
  opacity: 0; transition: opacity .12s;
}
.toast.show { opacity: 1; }
.toast.warn { border-color: var(--danger-border); color: var(--danger-text); background: var(--danger-bg); }

dialog {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-2); color: var(--text-1);
  max-width: 44rem; width: 90vw; padding: 0;
}
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog .dlg-head { display: flex; align-items: center; gap: .6rem;
  padding: .6rem .8rem; border-bottom: 1px solid var(--border); }
dialog h3 { margin: 0; font-size: .9rem; }
dialog pre {
  margin: 0; padding: .8rem; max-height: 60vh; overflow: auto;
  font-size: .74rem; line-height: 1.5; background: var(--surface-0); color: var(--text-2);
}
</style>
</head>
<body>

<header class="appbar">
  <h1>Message builder</h1>
  <span class="muted">Components&nbsp;V2 · prototype</span>
  <span class="spacer"></span>
  <button class="icon" id="btnUndo" title="Undo (Ctrl/Cmd+Z)">↶</button>
  <button class="icon" id="btnRedo" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
  <button id="btnJson">Show JSON</button>
  <button class="primary" id="btnPost">Post</button>
</header>

<main>
  <nav class="palette" id="palette">
    <div class="rail-title">Blocks</div>
    <!-- filled by JS -->
    <div class="pal-hint">
      Drag onto the message, or click to drop it after the selection.<br><br>
      <kbd>right-click</kbd> anything for its actions.
    </div>
  </nav>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-head">
      <h2>The message</h2>
      <span class="muted">click to select · click text to edit · drag to move</span>
    </div>
    <div id="canvas"></div>
  </div>

  <aside class="inspector" id="inspector"></aside>
</main>

<footer class="statusbar">
  <span id="statusLeft"></span>
  <span class="spacer"></span>
  <span id="statusRight"></span>
</footer>

<div class="toast" id="toast"></div>

<dialog id="jsonDlg">
  <div class="dlg-head">
    <h3>Payload</h3>
    <span class="muted" style="font-size:.72rem;color:var(--text-muted)">exactly what <code>RawComponentBuilder</code> would send</span>
    <span class="spacer" style="flex:1"></span>
    <button id="btnCopyJson">Copy</button>
    <button id="btnCloseJson">Close</button>
  </div>
  <pre id="jsonOut"></pre>
</dialog>

<script>
"use strict";
/* ===========================================================================
   Node model — raw Discord component dicts, identical to cv2_nodes.Node.
   =========================================================================== */
const T = {
  ACTION_ROW: 1, BUTTON: 2, SECTION: 9, TEXT: 10, THUMBNAIL: 11,
  MEDIA: 12, FILE: 13, SEPARATOR: 14, CONTAINER: 17,
};
const LINK_STYLE = 5;
const MAX_GALLERY = 10, MAX_SECTION_TEXTS = 3, MAX_TOP_LEVEL = 10;
const DEFAULT_ACCENT = 0xEC42A5;

/* cv2_nodes.kind() */
function kindOf(n) {
  return ({
    [T.CONTAINER]: "container", [T.TEXT]: "text", [T.SECTION]: "section",
    [T.MEDIA]: "media", [T.SEPARATOR]: "separator", [T.FILE]: "file",
    [T.THUMBNAIL]: "thumbnail", [T.ACTION_ROW]: "link_button", [T.BUTTON]: "link_button",
  })[n && n.type] || "unknown";
}
/* cv2_nodes._button_of() */
const buttonOf = (n) => (n.type === T.ACTION_ROW ? n.components[0] : n);

/* cv2_nodes constructors */
const make = {
  container: () => ({ type: T.CONTAINER, components: [], accent_color: DEFAULT_ACCENT }),
  text: (content = "") => ({ type: T.TEXT, content }),
  section: () => ({ type: T.SECTION, components: [{ type: T.TEXT, content: "" }] }),
  media: () => ({ type: T.MEDIA, items: [] }),
  separator: () => ({ type: T.SEPARATOR, divider: true, spacing: 1 }),
  thumbnail: () => ({ type: T.THUMBNAIL, media: { url: "" } }),
  button: () => ({ type: T.BUTTON, style: LINK_STYLE, label: "", url: "" }),
  link_button: () => ({ type: T.ACTION_ROW, components: [{ type: T.BUTTON, style: LINK_STYLE, label: "", url: "" }] }),
};

/* The palette. `acc` kinds are only ever a section accessory (cv2_nodes'
   ADD_LABELS "acc_*" pseudo-kinds), so they never appear in the left rail —
   you get them from the section's own empty slot instead. */
const PALETTE = [
  { kind: "text",        label: "Text",          glyph: "T",  hint: "Markdown text. Headings, bullets, links, emoji." },
  { kind: "container",   label: "Container",     glyph: "▤",  hint: "A coloured card. Top level only." },
  { kind: "section",     label: "Section",       glyph: "◧",  hint: "1–3 text blocks beside a thumbnail or button." },
  { kind: "media",       label: "Image gallery", glyph: "▣",  hint: "Up to 10 images in a grid." },
  { kind: "separator",   label: "Separator",     glyph: "—",  hint: "A divider line or a gap." },
  { kind: "link_button", label: "Link button",   glyph: "⬒",  hint: "A row of link buttons." },
];
const KIND_LABEL = {
  container: "Container", text: "Text", section: "Section", media: "Image gallery",
  separator: "Separator", link_button: "Link button", thumbnail: "Thumbnail", file: "File",
};

/* ===========================================================================
   State
   =========================================================================== */
const state = {
  nodes: seed(),
  sel: null,        // path (array of ints, or ints + "acc")
  editing: null,    // path currently open as a textarea
  editOrigin: "",   // its content when editing began, for a one-step undo
  undo: [], redo: [],
};

function seed() {
  return [
    { type: T.CONTAINER, accent_color: 0xEC42A5, components: [
      { type: T.TEXT, content: "# Weekly Reset\n-# Tuesday, 17:00 UTC" },
      { type: T.SEPARATOR, divider: true, spacing: 1 },
      { type: T.SECTION,
        components: [{ type: T.TEXT, content: "## Nightfall\n**The Corrupted** — Master\n- Champions: Barrier, Overload" }],
        accessory: { type: T.THUMBNAIL, media: { url: "" }, description: "Nightfall icon" } },
      { type: T.TEXT, content: "Rotating loot this week includes *Hung Jury SR4* and the usual [pinnacle sources](https://example.invalid/pinnacles)." },
      { type: T.ACTION_ROW, components: [
        { type: T.BUTTON, style: LINK_STYLE, label: "Full breakdown", url: "https://example.invalid/reset" },
      ] },
    ] },
  ];
}

/* --- path helpers -------------------------------------------------------- */
const samePath = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);
const isPrefix = (p, q) => p.length <= q.length && p.every((v, i) => v === q[i]);

function resolve(path) {
  let node = { type: T.CONTAINER, components: state.nodes };
  for (const seg of path) node = seg === "acc" ? node.accessory : node.components[seg];
  return node;
}
/* The mutable child list of the container/section at `scope` (root list if empty). */
function childList(scope) {
  if (!scope.length) return state.nodes;
  const n = resolve(scope);
  if (!n.components) n.components = [];
  return n.components;
}

/* --- nesting rules — mirrors cv2_nodes.addable_kinds() ------------------- */
function scopeKind(scope) { return scope.length ? kindOf(resolve(scope)) : "root"; }

function allowedIn(scope) {
  const sk = scopeKind(scope);
  if (sk === "section") return ["text"];                                  // + the accessory slot
  if (sk === "container") return ["text", "section", "media", "separator", "link_button"];
  return ["container", "text", "section", "media", "separator", "link_button"];
}
/* Why a kind can't go there — the UI says it out loud instead of hiding the option. */
function refusalReason(scope, kind) {
  const sk = scopeKind(scope);
  if (sk === "section") {
    if (kind === "thumbnail" || kind === "link_button") return "Drop it on the section's accessory slot instead.";
    if (childList(scope).length >= MAX_SECTION_TEXTS && kind === "text")
      return `A section holds at most ${MAX_SECTION_TEXTS} text blocks.`;
    return "A section holds text blocks and one accessory — nothing else.";
  }
  if (kind === "container") return "Containers are top level only — they can't nest.";
  if (kind === "thumbnail") return "A thumbnail is only ever a section's accessory.";
  return "That block can't go there.";
}
function canDrop(scope, kind, movingFrom) {
  if (movingFrom && isPrefix(movingFrom, scope)) return false;   // no dropping into yourself
  // A full section still accepts a *reorder* of its own children — that adds nothing.
  if (scopeKind(scope) === "section" && childList(scope).length >= MAX_SECTION_TEXTS
      && !(movingFrom && samePath(movingFrom.slice(0, -1), scope))) return false;
  return allowedIn(scope).includes(kind);
}

/* ===========================================================================
   Mutations — every one snapshots for undo first.
   =========================================================================== */
const clone = (v) => JSON.parse(JSON.stringify(v));

function commit(label, fn) {
  state.undo.push({ nodes: clone(state.nodes), sel: state.sel ? [...state.sel] : null });
  if (state.undo.length > 60) state.undo.shift();
  state.redo.length = 0;
  fn();
  render();
  setStatus(label);
}
function undo() {
  if (!state.undo.length) return;
  state.redo.push({ nodes: clone(state.nodes), sel: state.sel });
  const prev = state.undo.pop();
  state.nodes = prev.nodes; state.sel = prev.sel; state.editing = null;
  render(); setStatus("Undone");
}
function redo() {
  if (!state.redo.length) return;
  state.undo.push({ nodes: clone(state.nodes), sel: state.sel });
  const next = state.redo.pop();
  state.nodes = next.nodes; state.sel = next.sel; state.editing = null;
  render(); setStatus("Redone");
}

function insertAt(scope, index, node) {
  childList(scope).splice(index, 0, node);
  state.sel = [...scope, index];
}
function removeAt(path) {
  const scope = path.slice(0, -1), last = path[path.length - 1];
  if (last === "acc") { delete resolve(scope).accessory; state.sel = scope; return; }
  childList(scope).splice(last, 1);
  const list = childList(scope);
  state.sel = list.length ? [...scope, Math.min(last, list.length - 1)] : (scope.length ? scope : null);
}
/* Splicing a node out shifts every later sibling — and therefore every path
   that *descends through* one. Any path captured before the removal has to be
   rebased, or "drag this block into that container below it" resolves to the
   wrong node (or crashes). */
function adjustAfterRemoval(path, removed) {
  const rs = removed.slice(0, -1), ri = removed[removed.length - 1];
  if (ri === "acc" || !path) return path;
  if (path.length > rs.length && isPrefix(rs, path) && path[rs.length] > ri) {
    const p = [...path];
    p[rs.length] -= 1;
    return p;
  }
  return path;
}

function moveNode(from, toScope, toIndex) {
  const node = clone(resolve(from));
  const fromScope = from.slice(0, -1), fromIdx = from[from.length - 1];
  if (fromIdx === "acc") delete resolve(fromScope).accessory;
  else {
    childList(fromScope).splice(fromIdx, 1);
    // Removing an earlier sibling in the same scope shifts the target left.
    if (samePath(fromScope, toScope) && fromIdx < toIndex) toIndex--;
    toScope = adjustAfterRemoval(toScope, from);   // no-op when it's the same scope
  }
  insertAt(toScope, toIndex, node);
}

/* ===========================================================================
   Markdown — a JS approximation of hybrid_post_core._render_line.
   Production renders server-side (render_cv2_nodes_html); this is preview-only.
   =========================================================================== */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function inlineMd(s) {
  let h = esc(s);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  return h;
}
function lineMd(line) {
  if (line.startsWith("-# ")) return `<span class="md-small">${inlineMd(line.slice(3))}</span>`;
  if (line.startsWith("### ")) return `<span class="md-h3">${inlineMd(line.slice(4))}</span>`;
  if (line.startsWith("## ")) return `<span class="md-h2">${inlineMd(line.slice(3))}</span>`;
  if (line.startsWith("# ")) return `<span class="md-h1">${inlineMd(line.slice(2))}</span>`;
  if (/^[-*] /.test(line)) return `<span class="md-bullet">${inlineMd(line.slice(2))}</span>`;
  return inlineMd(line);
}
const renderMd = (s) => String(s).split("\n").map(lineMd).join("\n");

/* ===========================================================================
   Validation — messages lifted verbatim from cv2_nodes.validate(), but each
   one carries the PATH of the block that caused it, so it can be clicked.
   =========================================================================== */
function validate() {
  const out = [];
  const push = (path, msg) => out.push({ path, msg });
  if (!state.nodes.length) push(null, "The message is empty — add at least one block.");
  if (state.nodes.length > MAX_TOP_LEVEL)
    push(null, `Too many top-level blocks (${state.nodes.length}); Discord allows ${MAX_TOP_LEVEL}. Group some inside a container.`);

  (function walk(list, base) {
    list.forEach((node, i) => {
      const path = [...base, i], k = kindOf(node);
      if (k === "container") {
        if (!(node.components || []).length) push(path, "A container is empty — add a block inside or delete it.");
        walk(node.components || [], path);
      } else if (k === "section") {
        const texts = node.components || [];
        if (texts.length < 1 || texts.length > MAX_SECTION_TEXTS)
          push(path, `A section must have 1–${MAX_SECTION_TEXTS} text blocks (it has ${texts.length}).`);
        if (!node.accessory) push(path, "A section is missing its accessory (thumbnail or button).");
        else if (kindOf(node.accessory) === "thumbnail" && !(node.accessory.media || {}).url)
          push([...path, "acc"], "The section's thumbnail has no image URL.");
        walk(texts, path);
      } else if (k === "text") {
        if (!String(node.content || "").trim()) push(path, "A text block is empty.");
      } else if (k === "media") {
        if (!(node.items || []).length) push(path, "A media gallery has no images.");
      } else if (k === "link_button") {
        const b = buttonOf(node);
        if (!(b.label && b.url)) push(path, "A link button needs both a label and a URL.");
      }
    });
  })(state.nodes, []);
  return out;
}

/* ===========================================================================
   Render — the canvas IS the preview. Every node becomes a .blk carrying its
   path, and every gap becomes an insertion rail.
   =========================================================================== */
const canvas = document.getElementById("canvas");
const pk = (p) => JSON.stringify(p);

let problems = [];
function problemPaths() {
  const s = new Set();
  problems.forEach((p) => p.path && s.add(pk(p.path)));
  return s;
}

function render() {
  problems = validate();
  const bad = problemPaths();

  canvas.innerHTML = state.nodes.length
    ? renderScope([], state.nodes, bad)
    : `<div class="empty-canvas">Nothing here yet.<br>Drag a block from the left, or <b>right-click</b> for the menu.</div>`;

  renderInspector();
  document.getElementById("btnUndo").disabled = !state.undo.length;
  document.getElementById("btnRedo").disabled = !state.redo.length;
  document.getElementById("statusRight").textContent =
    `${countNodes(state.nodes)} blocks · ${state.nodes.length}/${MAX_TOP_LEVEL} top level`;
}
function countNodes(list) {
  return list.reduce((n, x) => n + 1 + countNodes(x.components || []) + (x.accessory ? 1 : 0), 0);
}

function renderScope(scope, list, bad) {
  const parts = [`<div class="scope" data-scope="${esc(pk(scope))}">`];
  parts.push(rail(scope, 0));
  list.forEach((node, i) => {
    parts.push(renderBlock([...scope, i], node, bad));
    parts.push(rail(scope, i + 1));
  });
  parts.push("</div>");
  return parts.join("");
}
function rail(scope, index) {
  return `<div class="rail" data-scope="${esc(pk(scope))}" data-index="${index}"></div>`;
}

function renderBlock(path, node, bad) {
  const k = kindOf(node);
  const cls = ["blk"];
  if (samePath(path, state.sel)) cls.push("sel");
  if (bad.has(pk(path))) cls.push("invalid");
  const grip = `<span class="blk-grip" title="Drag to move">⠿</span>`;
  const tag = `<span class="blk-tag">${esc(KIND_LABEL[k] || k)}</span>`;
  return `<div class="${cls.join(" ")}" data-path="${esc(pk(path))}" data-kind="${k}" draggable="true">
    ${grip}${tag}<div class="blk-body">${renderBody(path, node, k, bad)}</div>
  </div>`;
}

function renderBody(path, node, k, bad) {
  switch (k) {
    case "container": {
      const accent = Number.isInteger(node.accent_color)
        ? ` style="border-left-color:#${(node.accent_color & 0xFFFFFF).toString(16).padStart(6, "0")}"` : "";
      const inner = (node.components || []).length
        ? renderScope(path, node.components, bad)
        : `<div class="cv2-placeholder">Empty container — drop blocks in.</div>${rail(path, 0)}`;
      return `<div class="cv2-container"${accent}>${inner}</div>`;
    }
    case "text": {
      if (samePath(path, state.editing))
        return `<textarea class="blk-edit" data-editing="1">${esc(node.content || "")}</textarea>
                <span class="edit-hint">markdown · Esc to finish</span>`;
      const body = String(node.content || "").trim()
        ? renderMd(node.content)
        : `<span class="cv2-placeholder">Empty text — click to write.</span>`;
      return `<div class="cv2-text">${body}</div>`;
    }
    case "section": {
      const texts = renderScope(path, node.components || [], bad);
      return `<div class="cv2-section">
        <div class="cv2-section-body">${texts}</div>
        ${renderAccessory(path, node.accessory)}
      </div>`;
    }
    case "media": {
      const urls = (node.items || []).map((i) => (i.media || {}).url).filter(Boolean);
      if (!urls.length) return `<div class="cv2-placeholder">Image gallery — add URLs in the panel on the right.</div>`;
      const layout = { 1: "n1", 2: "n2", 3: "n3", 4: "n4" }[urls.length] || "many";
      return `<div class="cv2-media ${layout}">` + urls.map((u) =>
        `<span class="cv2-media-item"><img src="${esc(u)}" alt="" loading="lazy"></span>`).join("") + `</div>`;
    }
    case "separator":
      return node.divider === false
        ? `<div class="cv2-spacer"></div>`
        : `<hr class="cv2-sep"${node.spacing === 2 ? ' style="margin:.5rem 0"' : ""}>`;
    case "link_button": {
      const btns = (node.type === T.ACTION_ROW ? node.components : [node]) || [];
      return `<div class="cv2-buttons">` + btns.map((b) =>
        `<span class="cv2-button">${esc(b.label || "(no label)")}</span>`).join("") + `</div>`;
    }
    case "thumbnail": {
      const url = (node.media || {}).url;
      return url ? `<img class="cv2-thumb" src="${esc(url)}" alt="">`
                 : `<div class="acc-slot" style="cursor:pointer">no image<br>URL yet</div>`;
    }
    default:
      return `<div class="cv2-placeholder">Unsupported component (type ${esc(node.type)})</div>`;
  }
}

/* The accessory slot: an explicit, droppable target. This is the rule made
   visible — the Discord builder can only express it as two hidden "acc_*"
   options that appear in a dropdown once you've drilled into a section. */
function renderAccessory(sectionPath, acc) {
  const path = [...sectionPath, "acc"];
  if (!acc) {
    return `<div class="acc-slot" data-accslot="${esc(pk(sectionPath))}">drop a thumbnail<br>or button</div>`;
  }
  const sel = samePath(path, state.sel) ? " sel" : "";
  const k = kindOf(acc);
  const body = k === "thumbnail"
    ? ((acc.media || {}).url
        ? `<img class="cv2-thumb" src="${esc(acc.media.url)}" alt="">`
        : `<div class="acc-slot filled" style="width:84px;min-height:56px;border:1px dashed var(--err);color:var(--danger-text)">image URL missing</div>`)
    : `<span class="cv2-button">${esc(buttonOf(acc).label || "(no label)")}</span>`;
  return `<div class="blk acc-slot filled${sel}" data-path="${esc(pk(path))}" data-kind="${k}" data-accslot="${esc(pk(sectionPath))}" draggable="true">
    <span class="blk-tag">${esc(KIND_LABEL[k])}</span><div class="blk-body">${body}</div>
  </div>`;
}

/* ===========================================================================
   Inspector — live property editing. No modals: a modal is a Discord
   limitation, and every field here applies as you type.
   =========================================================================== */
const inspector = document.getElementById("inspector");

function renderInspector() {
  const parts = [];
  const node = state.sel ? safeResolve(state.sel) : null;

  if (!node) {
    parts.push(`<div class="insp-empty">
      <div class="insp-head"><h3>Nothing selected</h3></div>
      <p>Click a block in the message to edit it.</p>
      <ul>
        <li><b>Click</b> text to type into it</li>
        <li><b>Right-click</b> any block for its actions</li>
        <li><b>Drag</b> the ⠿ handle to move or re-nest</li>
        <li>Hover a gap for the <b>+</b> insert point</li>
        <li><kbd>Ctrl/Cmd</kbd>+<kbd>Z</kbd> undoes anything</li>
      </ul>
    </div>`);
  } else {
    const k = kindOf(node);
    parts.push(`<div class="insp-head"><h3>${esc(KIND_LABEL[k] || k)}</h3></div>`);
    parts.push(fieldsFor(k, node));
  }

  parts.push(problems.length
    ? `<div class="problems"><h4>Not ready to post</h4>${problems.map((p, i) =>
        `<button data-problem="${i}">• ${esc(p.msg)}</button>`).join("")}</div>`
    : `<div class="ok-note">✓ Ready to post.</div>`);

  inspector.innerHTML = parts.join("");
}
function safeResolve(path) { try { return resolve(path); } catch { state.sel = null; return null; } }

function fieldsFor(k, node) {
  switch (k) {
    case "container": {
      const hasAccent = Number.isInteger(node.accent_color);
      const hex = hasAccent ? "#" + (node.accent_color & 0xFFFFFF).toString(16).padStart(6, "0") : "#ec42a5";
      return `
        <div class="field">
          <label>Accent colour</label>
          <div class="row">
            <input type="color" data-prop="accent" value="${esc(hex)}">
            <input type="text" data-prop="accentHex" value="${hasAccent ? esc(hex) : ""}" placeholder="none">
          </div>
          <label class="inline"><input type="checkbox" data-prop="accentOff" ${hasAccent ? "" : "checked"}> No accent bar</label>
        </div>
        <label class="inline"><input type="checkbox" data-prop="spoiler" ${node.spoiler ? "checked" : ""}> Spoiler</label>`;
    }
    case "text":
      return `<div class="field">
        <label>Content</label>
        <textarea data-prop="content" rows="7">${esc(node.content || "")}</textarea>
        <span class="help"><code># ## ###</code> headings · <code>-#</code> small · <code>- </code> bullet · <code>**bold**</code> · <code>[text](url)</code></span>
      </div>`;
    case "separator":
      return `
        <label class="inline"><input type="checkbox" data-prop="divider" ${node.divider !== false ? "checked" : ""}> Show a divider line</label>
        <div class="field">
          <label>Spacing</label>
          <select data-prop="spacing">
            <option value="1" ${node.spacing !== 2 ? "selected" : ""}>Small</option>
            <option value="2" ${node.spacing === 2 ? "selected" : ""}>Large</option>
          </select>
        </div>`;
    case "media": {
      const items = node.items || [];
      const rows = items.map((it, i) =>
        `<div class="url-row"><input type="url" data-prop="mediaUrl" data-i="${i}" value="${esc((it.media || {}).url || "")}" placeholder="https://…">
         <button class="icon" data-act="mediaDel" data-i="${i}" title="Remove">✕</button></div>`).join("");
      return `<div class="field">
        <label>Images <span class="help">(${items.length}/${MAX_GALLERY})</span></label>
        ${rows || '<span class="help">No images yet.</span>'}
        <button data-act="mediaAdd" ${items.length >= MAX_GALLERY ? "disabled" : ""} style="margin-top:.3rem">Add image URL</button>
      </div>`;
    }
    case "link_button": {
      const b = buttonOf(node);
      return `
        <div class="field"><label>Label</label><input type="text" data-prop="btnLabel" value="${esc(b.label || "")}"></div>
        <div class="field"><label>URL</label><input type="url" data-prop="btnUrl" value="${esc(b.url || "")}" placeholder="https://…"></div>
        <div class="field"><label>Emoji <span class="help">optional</span></label>
          <input type="text" data-prop="btnEmoji" value="${esc(((b.emoji || {}).name) || "")}" maxlength="8"></div>`;
    }
    case "thumbnail":
      return `
        <div class="field"><label>Image URL</label><input type="url" data-prop="thumbUrl" value="${esc((node.media || {}).url || "")}" placeholder="https://…"></div>
        <div class="field"><label>Alt text <span class="help">optional</span></label><input type="text" data-prop="thumbDesc" value="${esc(node.description || "")}"></div>
        <label class="inline"><input type="checkbox" data-prop="thumbSpoiler" ${node.spoiler ? "checked" : ""}> Spoiler</label>`;
    case "section":
      return `<div class="insp-empty">
        <p>A section pairs <b>1–${MAX_SECTION_TEXTS} text blocks</b> with one accessory — a thumbnail or a link button.</p>
        <p>Click the text on the left to edit it, or the accessory slot on the right to fill it.</p>
      </div>`;
    default:
      return `<div class="insp-empty">Nothing to edit here.</div>`;
  }
}

/* Live property application. Typing coalesces into one undo step per field
   (a snapshot per keystroke would make undo useless). */
let liveKey = null;
function applyProp(prop, el) {
  const node = safeResolve(state.sel);
  if (!node) return;
  const key = prop + pk(state.sel);
  const structural = liveKey !== key;
  if (structural) { state.undo.push({ nodes: clone(state.nodes), sel: [...state.sel] }); state.redo.length = 0; liveKey = key; }

  const b = kindOf(node) === "link_button" ? buttonOf(node) : null;
  switch (prop) {
    case "accent": case "accentHex": {
      const v = el.value.trim();
      const m = /^#?([0-9a-fA-F]{6})$/.exec(v);
      if (m) node.accent_color = parseInt(m[1], 16);
      else if (!v) delete node.accent_color;
      break;
    }
    case "accentOff": el.checked ? delete node.accent_color : (node.accent_color = DEFAULT_ACCENT); break;
    case "spoiler": node.spoiler = el.checked; break;
    case "content": node.content = el.value; break;
    case "divider": node.divider = el.checked; break;
    case "spacing": node.spacing = Number(el.value); break;
    case "mediaUrl": {
      const i = Number(el.dataset.i);
      (node.items[i] ||= { media: { url: "" } }).media = { url: el.value.trim() };
      break;
    }
    case "btnLabel": b.label = el.value; break;
    case "btnUrl": b.url = el.value.trim(); break;
    case "btnEmoji": el.value.trim() ? (b.emoji = { name: el.value.trim() }) : delete b.emoji; break;
    case "thumbUrl": node.media = { url: el.value.trim() }; break;
    case "thumbDesc": el.value.trim() ? (node.description = el.value) : delete node.description; break;
    case "thumbSpoiler": node.spoiler = el.checked; break;
  }
  redrawCanvasOnly();
}
/* Repaint the canvas without rebuilding the inspector — otherwise the input
   you are typing into gets replaced and loses its caret. */
function redrawCanvasOnly() {
  problems = validate();
  const bad = problemPaths();
  canvas.innerHTML = state.nodes.length
    ? renderScope([], state.nodes, bad)
    : `<div class="empty-canvas">Nothing here yet.<br>Drag a block from the left, or <b>right-click</b> for the menu.</div>`;
  document.getElementById("btnUndo").disabled = !state.undo.length;
}

inspector.addEventListener("input", (e) => {
  const prop = e.target.dataset.prop;
  if (prop) applyProp(prop, e.target);
});
inspector.addEventListener("change", (e) => {
  const prop = e.target.dataset.prop;
  if (prop) { liveKey = null; applyProp(prop, e.target); render(); }
});
inspector.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.problem !== undefined) {
    const p = problems[Number(btn.dataset.problem)];
    if (p && p.path) { state.sel = p.path; render(); scrollToSel(); }
    return;
  }
  const node = safeResolve(state.sel);
  if (btn.dataset.act === "mediaAdd") commit("Image added", () => { (node.items ||= []).push({ media: { url: "" } }); });
  if (btn.dataset.act === "mediaDel") commit("Image removed", () => { node.items.splice(Number(btn.dataset.i), 1); });
});

/* ===========================================================================
   Canvas interaction: click to select, click text to edit.
   =========================================================================== */
canvas.addEventListener("click", (e) => {
  if (e.target.closest("[data-editing]")) return;

  const rail = e.target.closest(".rail");
  if (rail) { openPalette(e, JSON.parse(rail.dataset.scope), Number(rail.dataset.index)); return; }

  const slot = e.target.closest(".acc-slot:not(.filled)");
  if (slot) { openAccessoryMenu(e, JSON.parse(slot.dataset.accslot)); return; }

  const blk = e.target.closest(".blk");
  if (!blk) { state.sel = null; render(); return; }

  const path = JSON.parse(blk.dataset.path);
  // Text goes straight into edit — a click on words should put a caret there,
  // not select a "block" and make you click again.
  if (blk.dataset.kind === "text") { state.sel = path; startEdit(path); return; }
  state.sel = path;
  render();
});

canvas.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  if (state.editing) commitEdit();
  const blk = e.target.closest(".blk");
  if (blk) { state.sel = JSON.parse(blk.dataset.path); render(); openBlockMenu(e, state.sel); }
  else openPalette(e, [], state.nodes.length);
});

/* --- in-place text editing ----------------------------------------------
   Commit is deliberately SURGICAL: it swaps only the edited block's DOM rather
   than re-rendering the canvas. A full render here would tear the DOM out from
   under an in-flight click, so clicking from one text block into another would
   lose the second click. */
function startEdit(path) {
  state.editing = path;
  state.editOrigin = String(safeResolve(path).content || "");
  render();
  const ta = canvas.querySelector("[data-editing]");
  if (!ta) return;
  autosize(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener("input", () => autosize(ta));
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); ta.blur(); }
    // Ctrl/Cmd+Enter finishes; plain Enter is a newline, as in a Discord message.
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ta.blur(); }
  });
  ta.addEventListener("blur", commitEdit);
}
function autosize(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

function commitEdit() {
  const ta = canvas.querySelector("[data-editing]");
  const path = state.editing;
  if (!ta || !path) return;
  state.editing = null;
  const node = safeResolve(path);
  if (!node) { render(); return; }

  if (ta.value !== state.editOrigin) {
    // Snapshot the *pre-edit* tree so one edit session is one undo step.
    node.content = state.editOrigin;
    state.undo.push({ nodes: clone(state.nodes), sel: [...path] });
    if (state.undo.length > 60) state.undo.shift();
    state.redo.length = 0;
    node.content = ta.value;
    setStatus("Text updated");
  }
  const blk = ta.closest(".blk");
  if (blk) blk.outerHTML = renderBlock(path, node, problemPaths());
  refreshValidity();
}

/* Recompute problems and repaint only the error outlines + inspector. */
function refreshValidity() {
  problems = validate();
  const bad = problemPaths();
  canvas.querySelectorAll(".blk").forEach((el) => el.classList.toggle("invalid", bad.has(el.dataset.path)));
  renderInspector();
  document.getElementById("btnUndo").disabled = !state.undo.length;
}

function scrollToSel() {
  if (!state.sel) return;
  const want = pk(state.sel);
  const el = [...canvas.querySelectorAll(".blk")].find((n) => n.dataset.path === want);
  if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

/* ===========================================================================
   Drag & drop — replaces Move up / Move down AND Open ▸ / ◂ Back at once.
   Drop targets are the insertion rails and the accessory slots, so the drop
   point is always exact; an illegal rail turns red and says why.
   =========================================================================== */
let drag = null;   // {kind, from|null}

document.getElementById("palette").addEventListener("dragstart", (e) => {
  const item = e.target.closest(".pal-item");
  if (!item) return;
  drag = { kind: item.dataset.kind, from: null };
  e.dataTransfer.effectAllowed = "copy";
  e.dataTransfer.setData("text/plain", item.dataset.kind);
  markValidTargets();
});
canvas.addEventListener("dragstart", (e) => {
  const blk = e.target.closest(".blk");
  if (!blk) return;
  e.stopPropagation();
  drag = { kind: blk.dataset.kind, from: JSON.parse(blk.dataset.path) };
  blk.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", blk.dataset.kind);
  markValidTargets();
});
document.addEventListener("dragend", () => {
  drag = null;
  canvas.querySelectorAll(".dragging, .armed, .blocked").forEach((el) =>
    el.classList.remove("dragging", "armed", "blocked"));
  hideToast();
});

/* Pre-mark every rail so the legal drop points are visible the moment you
   pick something up — you learn the nesting rules by looking, not by failing. */
function markValidTargets() {
  if (!drag) return;
  canvas.querySelectorAll(".rail").forEach((r) => {
    const scope = JSON.parse(r.dataset.scope);
    r.classList.toggle("blocked", !canDrop(scope, drag.kind, drag.from));
  });
  const accOk = drag.kind === "thumbnail" || drag.kind === "link_button";
  canvas.querySelectorAll(".acc-slot:not(.filled)").forEach((s) => s.classList.toggle("blocked", !accOk));
}

canvas.addEventListener("dragover", (e) => {
  if (!drag) return;
  const rail = e.target.closest(".rail");
  const slot = e.target.closest(".acc-slot:not(.filled)");
  canvas.querySelectorAll(".armed").forEach((el) => el.classList.remove("armed"));

  if (rail) {
    const scope = JSON.parse(rail.dataset.scope);
    if (canDrop(scope, drag.kind, drag.from)) { e.preventDefault(); rail.classList.add("armed"); hideToast(); }
    else toast(refusalReason(scope, drag.kind), true);
    return;
  }
  if (slot && (drag.kind === "thumbnail" || drag.kind === "link_button")) {
    e.preventDefault(); slot.classList.add("armed"); hideToast();
  }
});

canvas.addEventListener("drop", (e) => {
  if (!drag) return;
  e.preventDefault();
  const rail = e.target.closest(".rail");
  const slot = e.target.closest(".acc-slot:not(.filled)");

  if (rail) {
    const scope = JSON.parse(rail.dataset.scope), index = Number(rail.dataset.index);
    if (!canDrop(scope, drag.kind, drag.from)) return;
    const d = drag;
    commit(d.from ? "Moved" : `${KIND_LABEL[d.kind]} added`, () => {
      if (d.from) moveNode(d.from, scope, index);
      else insertAt(scope, index, make[d.kind]());
    });
  } else if (slot) {
    const sectionPath = JSON.parse(slot.dataset.accslot);
    const d = drag;
    commit("Accessory set", () => {
      const node = d.from ? clone(resolve(d.from)) : (d.kind === "thumbnail" ? make.thumbnail() : make.button());
      // Hold the section by reference: removing the source below can rebase its
      // path, but the object itself never moves.
      const section = resolve(sectionPath);
      let target = sectionPath;
      if (d.from) { removeAt(d.from); target = adjustAfterRemoval(sectionPath, d.from); }
      // A section accessory is a BARE button, never an action row (cv2_nodes).
      section.accessory = node.type === T.ACTION_ROW ? node.components[0] : node;
      state.sel = [...target, "acc"];
    });
  }
  drag = null;
});

/* ===========================================================================
   Context menus — the "right-click anywhere" layer.
   =========================================================================== */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
document.addEventListener("mousedown", (e) => { if (menuEl && !e.target.closest(".menu")) closeMenu(); });

function showMenu(x, y, html) {
  closeMenu();
  menuEl = document.createElement("div");
  menuEl.className = "menu";
  menuEl.innerHTML = html;
  document.body.appendChild(menuEl);
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
  menuEl.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
  return menuEl;
}
const mi = (act, glyph, label, kbd = "", cls = "") =>
  `<button data-act="${act}" class="${cls}"><span class="glyph">${glyph}</span>${esc(label)}<span class="kbd">${kbd}</span></button>`;

/* Insert palette, anchored to the exact gap you clicked. Only kinds that are
   legal THERE are offered — same rule set as addable_kinds(), but the reason
   for an omission is one hover away rather than invisible. */
function openPalette(e, scope, index) {
  const legal = allowedIn(scope);
  const items = PALETTE.filter((p) => legal.includes(p.kind))
    .map((p) => mi("add:" + p.kind, p.glyph, p.label)).join("");
  const el = showMenu(e.clientX, e.clientY,
    `<div class="menu-label">Add here</div>${items}`);
  el.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    const kind = b.dataset.act.slice(4);
    closeMenu();
    commit(`${KIND_LABEL[kind]} added`, () => insertAt(scope, index, make[kind]()));
    if (kind === "text") startEdit(state.sel);
  });
}

function openAccessoryMenu(e, sectionPath) {
  const el = showMenu(e.clientX, e.clientY,
    `<div class="menu-label">Section accessory</div>` +
    mi("acc:thumbnail", "▣", "Thumbnail image") +
    mi("acc:link_button", "⬒", "Link button"));
  el.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    const kind = b.dataset.act.slice(4);
    closeMenu();
    commit("Accessory added", () => {
      resolve(sectionPath).accessory = kind === "thumbnail" ? make.thumbnail() : make.button();
      state.sel = [...sectionPath, "acc"];
    });
  });
}

function openBlockMenu(e, path) {
  const node = resolve(path), k = kindOf(node);
  const scope = path.slice(0, -1), idx = path[path.length - 1];
  const isAcc = idx === "acc";
  const list = isAcc ? [] : childList(scope);
  const canWrap = !isAcc && !scope.length && k !== "container";

  const el = showMenu(e.clientX, e.clientY, [
    k === "text" ? mi("edit", "✎", "Edit text", "Click") : "",
    mi("dup", "⧉", "Duplicate", "Ctrl+D"),
    canWrap ? mi("wrap", "▤", "Wrap in a container") : "",
    "<hr>",
    isAcc ? "" : mi("above", "↑", "Add block above"),
    isAcc ? "" : mi("below", "↓", "Add block below"),
    isAcc || list.length < 2 ? "" : mi("top", "⤒", "Move to top"),
    isAcc || list.length < 2 ? "" : mi("bottom", "⤓", "Move to bottom"),
    "<hr>",
    mi("del", "✕", isAcc ? "Remove accessory" : "Delete", "Del", "danger"),
  ].join(""));

  el.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    const act = b.dataset.act;
    closeMenu();
    if (act === "edit") { startEdit(path); return; }
    if (act === "above") { openPalette(e, scope, idx); return; }
    if (act === "below") { openPalette(e, scope, idx + 1); return; }
    if (act === "dup") return commit("Duplicated", () => {
      if (isAcc) return;
      insertAt(scope, idx + 1, clone(node));
    });
    if (act === "wrap") return commit("Wrapped in a container", () => {
      const wrapper = make.container();
      wrapper.components = [clone(node)];
      childList(scope).splice(idx, 1, wrapper);
      state.sel = [...scope, idx];
    });
    if (act === "top") return commit("Moved to top", () => moveNode(path, scope, 0));
    if (act === "bottom") return commit("Moved to bottom", () => moveNode(path, scope, list.length));
    if (act === "del") return commit("Deleted", () => removeAt(path));
  });
}

/* ===========================================================================
   Keyboard — the shortcuts a Discord message simply cannot offer.
   =========================================================================== */
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const mod = e.metaKey || e.ctrlKey;

  if (e.key === "Escape" && menuEl) { closeMenu(); return; }
  if (mod && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y" && !typing) { e.preventDefault(); redo(); return; }
  if (typing) return;

  if (mod && e.key.toLowerCase() === "d" && state.sel) {
    e.preventDefault();
    const path = state.sel, idx = path[path.length - 1];
    if (idx === "acc") return;
    commit("Duplicated", () => insertAt(path.slice(0, -1), idx + 1, clone(resolve(path))));
    return;
  }
  if ((e.key === "Delete" || e.key === "Backspace") && state.sel) {
    e.preventDefault(); commit("Deleted", () => removeAt(state.sel)); return;
  }
  if (e.key === "Enter" && state.sel) {
    e.preventDefault();
    const path = state.sel, idx = path[path.length - 1];
    if (idx === "acc") return;
    const scope = path.slice(0, -1);
    if (!canDrop(scope, "text", null)) return;
    commit("Text added", () => insertAt(scope, idx + 1, make.text()));
    startEdit(state.sel);
    return;
  }
  if (e.key === "Escape") { state.sel = null; render(); }
});

/* ===========================================================================
   Toolbar, toast, JSON
   =========================================================================== */
const toastEl = document.getElementById("toast");
let toastTimer = null;
function toast(msg, warn = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle("warn", warn);
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 2200);
}
function hideToast() { toastEl.classList.remove("show"); }
function setStatus(msg) { document.getElementById("statusLeft").textContent = msg || ""; }

document.getElementById("btnUndo").onclick = undo;
document.getElementById("btnRedo").onclick = redo;

const jsonDlg = document.getElementById("jsonDlg");
document.getElementById("btnJson").onclick = () => {
  document.getElementById("jsonOut").textContent = JSON.stringify(state.nodes, null, 2);
  jsonDlg.showModal();
};
document.getElementById("btnCloseJson").onclick = () => jsonDlg.close();
document.getElementById("btnCopyJson").onclick = () => {
  navigator.clipboard.writeText(JSON.stringify(state.nodes, null, 2)).then(() => toast("Copied"));
};
document.getElementById("btnPost").onclick = () => {
  if (problems.length) {
    const first = problems.find((p) => p.path);
    if (first) { state.sel = first.path; render(); scrollToSel(); }
    toast(`${problems.length} problem${problems.length > 1 ? "s" : ""} to fix first`, true);
    return;
  }
  toast("Would POST the node list to the server");
};

/* Palette rail */
const paletteEl = document.getElementById("palette");
PALETTE.forEach((p) => {
  const b = document.createElement("button");
  b.className = "pal-item"; b.draggable = true;
  b.dataset.kind = p.kind; b.title = p.hint;
  b.innerHTML = `<span class="glyph">${p.glyph}</span>${esc(p.label)}`;
  b.addEventListener("click", () => {
    // Click = "put it after what I have selected", the one behaviour worth
    // keeping from the Discord builder (_insert_at_selection).
    let scope = [], index = state.nodes.length;
    if (state.sel && state.sel[state.sel.length - 1] !== "acc") {
      const s = state.sel.slice(0, -1);
      if (canDrop(s, p.kind, null)) { scope = s; index = state.sel[state.sel.length - 1] + 1; }
    }
    if (!canDrop(scope, p.kind, null)) { toast(refusalReason(scope, p.kind), true); return; }
    commit(`${p.label} added`, () => insertAt(scope, index, make[p.kind]()));
    if (p.kind === "text") startEdit(state.sel);
  });
  paletteEl.insertBefore(b, paletteEl.querySelector(".pal-hint"));
});

render();
setStatus("Right-click anything · Ctrl/Cmd+Z undoes");
</script>
</body>
</html>
